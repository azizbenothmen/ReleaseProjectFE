<aside class="sidebar">
  <div class="brand">
    <div class="elyadata-logo-icon" aria-hidden="true">
      <svg viewBox="0 0 100 120" width="22" height="26" fill="none">
        <circle cx="50" cy="38" r="32" fill="#00ADEF"/>
        <circle cx="50" cy="82" r="32" fill="#E20074"/>
        <path d="M 23.5 56 A 32 32 0 0 0 76.5 56 A 32 32 0 0 0 23.5 56 Z" fill="#004B87"/>
      </svg>
    </div>
    <span class="brand-name">elyadata <span class="brand-sub">Release</span></span>
  </div>

  <nav class="nav-group">
    <a class="nav-btn"
      routerLink="/home"
      routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M9 21v-6h6v6"/>
      </svg>
      <span>Home</span>
    </a>
    
    <a class="nav-btn"
      routerLink="/projects"
      routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="14" rx="2"/>
        <path d="M3 9h18"/>
      </svg>
      <span>Projets</span>
    </a>

    <a class="nav-btn"
      *ngIf="owner"
      [routerLink]="['/owner', owner, 'builds']"
      routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>Builds</span>
    </a>

    <a class="nav-btn"
      routerLink="/profile"
      routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profil</span>
    </a>

  </nav>

  <button type="button" class="nav-btn logout-btn" (click)="logout()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <path d="M16 17l5-5-5-5"/>
      <path d="M21 12H9"/>
    </svg>
    <span>Déconnexion</span>
  </button>
</aside>
