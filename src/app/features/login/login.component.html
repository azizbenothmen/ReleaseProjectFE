<div class="login-card">
  <p class="eyebrow">Session · Secure access</p>
  <h1>Log in</h1>
  <p class="subtitle">Choose a provider to continue, or use your email.</p>
  <form (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
    </div>
    <button class="submit-btn" type="submit">Log in</button>
  </form>

  <p class="footer-note">Don't have an account yet? <a href="#">Create an account</a></p>
</div>
