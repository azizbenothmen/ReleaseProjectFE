<div class="page-layout">

  <div class="tag-form-container repo-container">
    <h2>Import Git Repository</h2>

    <div class="form-group">
      <label>Search</label>
      <input
        type="text"
        placeholder="Search repositories..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
      />
    </div>

    <div *ngIf="loading" class="loading">Loading repositories...</div>

    <div class="repo-list" *ngIf="!loading">
      <div class="repo-row" *ngFor="let repo of pagedRepos">
        <div class="repo-info">
          <span class="repo-name">{{ repo.name }}</span>
          <span class="repo-owner">· {{ repo.owner?.login }}</span>
        </div>

        <button type="button" (click)="importRepo(repo)">
          Import
        </button>
      </div>

      <div *ngIf="filteredRepos.length === 0" class="empty-state">
        No repository found.
      </div>
    </div>

    <div class="pagination" *ngIf="!loading && filteredRepos.length > 0">
      <button
        type="button"
        class="page-nav"
        (click)="goToPage(currentPage - 1)"
        [disabled]="currentPage === 1"
      >‹</button>

      <button
        type="button"
        class="page-number"
        *ngFor="let page of pageNumbers"
        [class.active]="page === currentPage"
        (click)="goToPage(page)"
      >{{ page }}</button>

      <button
        type="button"
        class="page-nav"
        (click)="goToPage(currentPage + 1)"
        [disabled]="currentPage === totalPages"
      >›</button>
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>

  <div class="tag-form-container repo-container">
    <h2>Repos</h2>

    <div *ngIf="loadingImported" class="loading">Loading...</div>

    <div class="repo-list" *ngIf="!loadingImported && importedRepos.length > 0; else emptyImported">
      <div class="repo-row" *ngFor="let repo of pagedImportedRepos">
        <div class="repo-info">
          <span class="repo-name">{{ repo.name }}</span>
          <span class="repo-owner">· {{ repo.owner?.login }}</span>
        </div>

        <button type="button" (click)="goToTag(repo)">
          Tag
        </button>
      </div>
    </div>

    <div class="pagination" *ngIf="!loadingImported && importedRepos.length > 0">
      <button
        type="button"
        class="page-nav"
        (click)="goToPageImported(currentPageImported - 1)"
        [disabled]="currentPageImported === 1"
      >‹</button>

      <button
        type="button"
        class="page-number"
        *ngFor="let page of pageNumbersImported"
        [class.active]="page === currentPageImported"
        (click)="goToPageImported(page)"
      >{{ page }}</button>

      <button
        type="button"
        class="page-nav"
        (click)="goToPageImported(currentPageImported + 1)"
        [disabled]="currentPageImported === totalPagesImported"
      >›</button>
    </div>

    <ng-template #emptyImported>
      <div class="empty-state" *ngIf="!loadingImported">Nothing Here</div>
    </ng-template>

    <div class="error" *ngIf="importedErrorMessage">{{ importedErrorMessage }}</div>
  </div>

</div>
