<div class="shell">

  <!-- Main content -->
  <main class="main">
    <p class="eyebrow">Dashboard</p>
    <h1>Overview</h1>
    <p class="subtitle">General statistics for your workspace.</p>

    <section class="stat-grid">
      <article class="stat-card" *ngFor="let s of stats; let i = index" [style.animation-delay.ms]="i * 60">
        <p class="stat-label">{{ s.label }}</p>
        <p class="stat-value">{{ s.value }}</p>
        <p class="stat-delta" [class.negative]="!s.positive">{{ s.delta }}</p>
      </article>
    </section>
  </main>

</div>
